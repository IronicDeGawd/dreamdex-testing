services:
  agent:
    build: .
    image: dreamdex-agent:latest
    container_name: dreamdex-agent
    restart: unless-stopped
    # Host network namespace: the agent makes outbound RPC/HTTP calls only
    # (no inbound server). Kept from R2 to avoid the box's bridge-NAT quirk.
    network_mode: host
    env_file:
      - .env
    environment:
      # Gemini strategist via Vertex AI using the host's ADC file (mounted below).
      # google-genai reads creds from this path at runtime — no gcloud CLI needed.
      # Set GOOGLE_CLOUD_PROJECT + STRATEGIST_ENABLED in .env.
      - GOOGLE_APPLICATION_CREDENTIALS=/app/adc.json
      - GOOGLE_GENAI_USE_VERTEXAI=true
      - GOOGLE_CLOUD_LOCATION=us-central1
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data   # sqlite agent memory; survives container rebuilds
      # Host ADC credentials (read-only) for the Gemini strategist.
      - /home/irony/.config/gcloud/application_default_credentials.json:/app/adc.json:ro
    # Liveness via DB freshness: the agent writes a quote_context row every
    # poll cycle, so a stale table means the loop has wedged.
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import sqlite3,time,sys; c=sqlite3.connect('/app/data/agent.db'); r=c.execute('SELECT MAX(ts) FROM quote_context').fetchone(); sys.exit(0 if r and r[0] and time.time()-r[0]<600 else 1)\" || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
